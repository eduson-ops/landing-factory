<!doctype html>
<!-- partners-01-logos: «Лидирующие компании доверяют» — заголовок + полоса
     с brand-mark компаний-партнёров. Реальные SVG-лого вставляются продактом
     перед публикацией; здесь — letter-mark в брендовых цветах. -->
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Партнёры · логотипы</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    .partners { padding: 56px 0 64px; }
    .partners h2 {
      text-align: center;
      font-size: clamp(22px, 2.6vw, 30px);
      font-weight: var(--fw-extrabold);
      line-height: 1.3;
      max-width: 720px;
      margin: 0 auto 28px;
    }

    .partners-strip {
      background: var(--color-surface);
      border-radius: 100px;
      padding: 18px 28px;
      box-shadow: var(--shadow-card);
    }
    .partners-track {
      display: flex; align-items: center;
      gap: 28px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .partner-logo {
      display: inline-flex; align-items: center;
      gap: 8px;
      font-weight: var(--fw-bold);
      font-size: 15px;
      color: var(--color-text);
      letter-spacing: -0.01em;
    }
    .brand-mark {
      flex: 0 0 auto;
      width: 24px; height: 24px;
      display: inline-flex;
    }
    .brand-mark svg { width: 100%; height: 100%; display: block; }

    @media (max-width: 640px) {
      .partners-strip { border-radius: 24px; padding: 16px 20px; }
      .partners-track { gap: 18px; }
      .partner-logo { font-size: 13px; }
    }
  </style>
</head>
<body class="theme-light-violet">
  <section class="partners">
    <div class="container">
      <h2>Лидирующие компании доверяют Академии Эдюсон обучение своих сотрудников</h2>
      <div class="partners-strip">
        <div class="partners-track">

          <span class="partner-logo">
            <span class="brand-mark"><svg viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#21A038"/><text x="12" y="17" font-size="13" font-weight="900" fill="#fff" text-anchor="middle" font-family="Inter,Arial">С</text></svg></span>
            СБЕР
          </span>

          <span class="partner-logo">
            <span class="brand-mark"><svg viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#E94B4F"/><text x="12" y="17" font-size="13" font-weight="900" fill="#fff" text-anchor="middle" font-family="Inter,Arial">М</text></svg></span>
            М.Видео
          </span>

          <span class="partner-logo">
            <span class="brand-mark"><svg viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#FFC700"/><text x="12" y="17" font-size="13" font-weight="900" fill="#000" text-anchor="middle" font-family="Inter,Arial">Б</text></svg></span>
            билайн
          </span>

          <span class="partner-logo">
            <span class="brand-mark"><svg viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#FF4F12"/><text x="12" y="17" font-size="13" font-weight="900" fill="#fff" text-anchor="middle" font-family="Inter,Arial">Р</text></svg></span>
            Ростелеком
          </span>

          <span class="partner-logo">
            <span class="brand-mark"><svg viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#00C18A"/><text x="12" y="17" font-size="13" font-weight="900" fill="#fff" text-anchor="middle" font-family="Inter,Arial">A</text></svg></span>
            Avito
          </span>

          <span class="partner-logo">
            <span class="brand-mark"><svg viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#0066FF"/><text x="12" y="17" font-size="11" font-weight="900" fill="#fff" text-anchor="middle" font-family="Inter,Arial">X5</text></svg></span>
            X5 Group
          </span>

          <span class="partner-logo">
            <span class="brand-mark"><svg viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#005BFF"/><text x="12" y="17" font-size="13" font-weight="900" fill="#fff" text-anchor="middle" font-family="Inter,Arial">O</text></svg></span>
            Ozon
          </span>

          <span class="partner-logo">
            <span class="brand-mark"><svg viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#0077FF"/><text x="12" y="17" font-size="13" font-weight="900" fill="#fff" text-anchor="middle" font-family="Inter,Arial">V</text></svg></span>
            VK
          </span>

        </div>
      </div>
    </div>
  </section>
  <script src="../js/components.js" defer></script>
</body>
</html>
