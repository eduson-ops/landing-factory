<!doctype html>
<!-- ratings-01-aggregators: «Студенты любят наши курсы» — белые карточки
     с логотипами агрегаторов (Яндекс, Сравни, Хабр, 2GIS, tutortop), оценкой
     и количеством отзывов.
     Ref: refrences/Снимок экрана 2026-05-11 145302.png (верх) -->
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Рейтинги · агрегаторы</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    .rate { padding: 56px 0 64px; }
    .rate-head { text-align: center; margin-bottom: 24px; }
    .rate-head h2 { font-size: clamp(26px, 3.6vw, 40px); }
    .rate-head p { color: var(--color-text-muted); margin-top: 6px; font-size: 14px; }

    .rate-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .rate-card {
      background: var(--color-surface);
      border-radius: var(--radius-md);
      padding: 18px;
      box-shadow: var(--shadow-card);
      text-align: center;
    }
    .rate-logo {
      height: 26px;
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px;
      margin-bottom: 10px;
      font-weight: var(--fw-bold);
      font-size: 14px;
    }
    .rate-logo .dot { width: 12px; height: 12px; border-radius: 3px; }
    .rate-card .rating-line { color: var(--color-text-muted); font-size: 12px; }
    .rate-card .rating-line b { color: var(--color-text); font-weight: var(--fw-bold); font-size: 14px; }
    .rate-card .rating-num { color: var(--color-text-muted); font-size: 11px; margin-top: 4px; }

    @media (max-width: 768px) { .rate-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 420px) { .rate-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body class="theme-light-violet">
  <section class="rate">
    <div class="container">
      <div class="rate-head">
        <h2>Студенты любят наши курсы</h2>
        <p>Средний рейтинг 4.8</p>
      </div>
      <div class="rate-grid">
        <div class="rate-card"><div class="rate-logo"><span class="dot" style="background:#FFD600"></span>Яндекс Карты</div><div class="rating-line">Рейтинг: <b>5</b></div><div class="rating-num">160 отзывов</div></div>
        <div class="rate-card"><div class="rate-logo"><span class="dot" style="background:#33C25E"></span>Сравни</div><div class="rating-line">Рейтинг: <b>4.85</b></div><div class="rating-num">740 отзывов</div></div>
        <div class="rate-card"><div class="rate-logo"><span class="dot" style="background:#212121"></span>Хабр Курсы</div><div class="rating-line">Рейтинг: <b>4.97</b></div><div class="rating-num">320 отзывов</div></div>
        <div class="rate-card"><div class="rate-logo"><span class="dot" style="background:#26A569"></span>2GIS</div><div class="rating-line">Рейтинг: <b>4.9</b></div><div class="rating-num">195 отзывов</div></div>
        <div class="rate-card"><div class="rate-logo"><span class="dot" style="background:#7B61FF"></span>tutortop</div><div class="rating-line">Рейтинг: <b>4.89</b></div><div class="rating-num">560 отзывов</div></div>
      </div>
    </div>
  </section>
  <script src="../js/components.js" defer></script>
</body>
</html>
