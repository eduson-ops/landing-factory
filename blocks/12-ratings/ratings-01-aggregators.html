<!doctype html>
<!-- ratings-01-aggregators: «Студенты любят наши курсы» — белые карточки
     с brand-mark (SVG letter в брендовом фоне) + оценкой + кол-вом отзывов.
     Реальные SVG-лого брендов вставляются продактом перед публикацией;
     здесь — letter-mark в брендовых цветах для визуальной близости. -->
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Рейтинги · агрегаторы</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    .rate { padding: 56px 0 64px; }
    .rate-head { text-align: center; margin-bottom: 28px; }
    .rate-head h2 { font-size: clamp(28px, 3.6vw, 40px); font-weight: var(--fw-extrabold); }
    .rate-head p { color: var(--color-text-muted); margin-top: 8px; font-size: 14px; }

    .rate-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
      max-width: 1120px;
      margin: 0 auto;
    }
    .rate-card {
      background: var(--color-surface);
      border-radius: var(--radius-md);
      padding: 20px;
      box-shadow: var(--shadow-card);
      display: flex; flex-direction: column;
      gap: 10px;
    }
    .rate-logo {
      display: inline-flex; align-items: center;
      gap: 8px;
      font-weight: var(--fw-bold);
      font-size: 14px;
      color: var(--color-text);
    }
    .brand-mark {
      flex: 0 0 auto;
      display: inline-flex; width: 24px; height: 24px;
    }
    .brand-mark svg { width: 100%; height: 100%; display: block; }

    .rate-card .rating-line {
      color: var(--color-primary);
      font-size: 12px;
      font-weight: var(--fw-medium);
    }
    .rate-card .rating-line b {
      color: var(--color-text);
      font-weight: var(--fw-bold);
      font-size: 18px;
      margin-left: 4px;
    }
    .rate-card .rating-num {
      color: var(--color-text-muted);
      font-size: 12px;
    }

    @media (max-width: 768px) { .rate-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 420px) { .rate-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body class="theme-light-violet">
  <section class="rate">
    <div class="container">
      <div class="rate-head">
        <h2>Студенты любят наши курсы</h2>
        <p>Средний рейтинг 4.8</p>
      </div>

      <div class="rate-grid">
        <div class="rate-card">
          <div class="rate-logo">
            <span class="brand-mark"><svg viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#FFCC00"/><text x="12" y="17" font-size="13" font-weight="900" fill="#000" text-anchor="middle" font-family="Inter,Arial">Я</text></svg></span>
            Яндекс Карты
          </div>
          <div class="rating-line">Рейтинг:<b>5</b></div>
          <div class="rating-num">160 отзывов</div>
        </div>

        <div class="rate-card">
          <div class="rate-logo">
            <span class="brand-mark"><svg viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#33C25E"/><text x="12" y="17" font-size="13" font-weight="900" fill="#fff" text-anchor="middle" font-family="Inter,Arial">С</text></svg></span>
            Сравни
          </div>
          <div class="rating-line">Рейтинг:<b>4.85</b></div>
          <div class="rating-num">740 отзывов</div>
        </div>

        <div class="rate-card">
          <div class="rate-logo">
            <span class="brand-mark"><svg viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#0A0A0F"/><text x="12" y="17" font-size="13" font-weight="900" fill="#fff" text-anchor="middle" font-family="Inter,Arial">h</text></svg></span>
            Хабр Курсы
          </div>
          <div class="rating-line">Рейтинг:<b>4.97</b></div>
          <div class="rating-num">320 отзывов</div>
        </div>

        <div class="rate-card">
          <div class="rate-logo">
            <span class="brand-mark"><svg viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#26A569"/><text x="12" y="17" font-size="11" font-weight="900" fill="#fff" text-anchor="middle" font-family="Inter,Arial">2GIS</text></svg></span>
            2GIS
          </div>
          <div class="rating-line">Рейтинг:<b>4.9</b></div>
          <div class="rating-num">195 отзывов</div>
        </div>

        <div class="rate-card">
          <div class="rate-logo">
            <span class="brand-mark"><svg viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#7B61FF"/><text x="12" y="17" font-size="13" font-weight="900" fill="#fff" text-anchor="middle" font-family="Inter,Arial">t</text></svg></span>
            tutortop
          </div>
          <div class="rating-line">Рейтинг:<b>4.89</b></div>
          <div class="rating-num">560 отзывов</div>
        </div>
      </div>
    </div>
  </section>
  <script src="../js/components.js" defer></script>
</body>
</html>
