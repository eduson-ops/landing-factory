<!doctype html>
<!-- cta-01-inline: горизонтальная форма «Есть вопросы? Закажи бесплатную консультацию».
     Имя, телефон, e-mail, чёрная pill-кнопка «Отправить заявку».
     Ref: refrences/Снимок экрана 2026-05-11 144951.png (низ) -->
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CTA · inline</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    .cta1 { padding: 56px 0 64px; }
    .cta1-card {
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      padding: 28px 32px;
      box-shadow: var(--shadow-card);
      max-width: 1080px;
      margin: 0 auto;
    }
    .cta1-card h3 { font-size: 22px; margin-bottom: 18px; }
    .cta1-card form {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 12px;
    }
    .cta1-card .checkbox { font-size: 13px; margin-top: 14px; color: var(--color-text-muted); }

    @media (max-width: 992px) {
      .cta1-card form { grid-template-columns: 1fr 1fr; }
      .cta1-card form .btn { grid-column: span 2; }
    }
    @media (max-width: 560px) {
      .cta1-card form { grid-template-columns: 1fr; }
      .cta1-card form .btn { grid-column: auto; }
    }
  </style>
</head>
<body class="theme-light-violet">
  <section class="cta1">
    <div class="container">
      <div class="cta1-card">
        <h3>Есть вопросы? Закажи бесплатную консультацию</h3>
        <form data-cta-form>
          <div class="field"><input type="text" placeholder="Имя"></div>
          <div class="field"><input type="tel" placeholder="+7 (000) 000-00-00"></div>
          <div class="field"><input type="email" placeholder="Электронная почта"></div>
          <button class="btn btn--dark">Отправить заявку</button>
        </form>
        <label class="checkbox"><input type="checkbox" checked> Я соглашаюсь на обработку персональных данных</label>
      </div>
    </div>
  </section>
  <script src="../js/components.js" defer></script>
</body>
</html>
