<!doctype html>
<!-- hero-05-bg-photo: hero с фото на фоне (background-image) + контент слева
     поверх затемнения. Паттерн встречается на ops/python/PM лендингах Eduson. -->
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hero · bg-photo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    .hero5 {
      position: relative;
      min-height: 560px;
      padding: 64px 0 80px;
      background-image: url("../img/hero-placeholder.jpg");
      background-size: cover;
      background-position: center right;
      color: #fff;
      overflow: hidden;
    }
    .hero5::before {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(90deg, rgba(15,15,18,0.78) 0%, rgba(15,15,18,0.55) 45%, rgba(15,15,18,0.15) 100%);
      z-index: 1;
    }
    .hero5 > .container { position: relative; z-index: 2; }
    .hero5-grid { display: grid; grid-template-columns: minmax(0, 0.58fr) 1fr; gap: 32px; align-items: center; }
    .hero5-eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 5px 12px;
      border-radius: var(--radius-pill);
      background: rgba(255,255,255,0.18);
      backdrop-filter: blur(6px);
      color: #fff;
      font-size: 13px; font-weight: var(--fw-medium);
      margin-bottom: 18px;
    }
    .hero5-eyebrow::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--color-accent-yellow); }
    .hero5 h1 {
      font-size: clamp(36px, 5.2vw, 60px);
      line-height: 1.05;
      margin-bottom: 18px;
      color: #fff;
    }
    .hero5-lead {
      font-size: 18px; line-height: 1.5;
      color: rgba(255,255,255,0.86);
      max-width: 520px;
      margin-bottom: 30px;
    }
    .hero5-meta { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 30px; }
    .hero5-meta-item {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 14px;
      color: rgba(255,255,255,0.86);
    }
    .hero5-meta-item svg { width: 18px; height: 18px; color: var(--color-accent-yellow); }
    .hero5-cta-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .hero5-cta-row .btn--primary { background: var(--color-accent-yellow); color: var(--color-cta-dark); }
    .hero5-cta-row .btn--ghost { color: #fff; border-color: rgba(255,255,255,0.4); }
    .hero5-cta-row .btn--ghost:hover { background: rgba(255,255,255,0.12); }

    .hero5-badges {
      position: absolute; right: 24px; bottom: 24px;
      display: flex; flex-direction: column; gap: 12px;
      align-items: flex-end;
      z-index: 2;
    }
    .hero5-discount {
      background: var(--color-accent-yellow);
      color: var(--color-cta-dark);
      padding: 10px 16px;
      border-radius: var(--radius-md);
      font-weight: var(--fw-black);
      display: inline-flex; flex-direction: column; align-items: center;
      line-height: 1.1;
    }
    .hero5-discount big { font-size: 22px; }
    .hero5-discount small { font-size: 11px; opacity: 0.85; margin-top: 2px; font-weight: var(--fw-medium); }
    .hero5-rating {
      background: rgba(255,255,255,0.96);
      color: var(--color-text);
      border-radius: var(--radius-md);
      padding: 10px 16px;
      display: inline-flex; align-items: center; gap: 12px;
      font-size: 13px;
      box-shadow: var(--shadow-pop);
    }
    .hero5-rating b { font-size: 22px; font-weight: var(--fw-black); line-height: 1; }
    .hero5-rating .stars { color: #FFB400; letter-spacing: 0.5px; }

    @media (max-width: 992px) {
      .hero5 { background-position: center; }
      .hero5::before { background: linear-gradient(180deg, rgba(15,15,18,0.55) 0%, rgba(15,15,18,0.82) 100%); }
      .hero5-grid { grid-template-columns: 1fr; }
      .hero5-badges { position: static; flex-direction: row; align-items: center; margin-top: 24px; }
    }
    @media (max-width: 560px) {
      .hero5 { min-height: 0; padding: 48px 0 60px; }
      .hero5 h1 { font-size: clamp(28px, 8vw, 40px); }
      .hero5-cta-row .btn { width: 100%; }
      .hero5-badges { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body class="theme-light-violet">
  <section class="hero5">
    <div class="container">
      <div class="hero5-grid">
        <div class="hero5-left">
          <span class="hero5-eyebrow">Онлайн-курс</span>
          <h1>Заголовок профессии или роли</h1>
          <p class="hero5-lead">Краткое ценностное обещание: что человек научится делать и какой результат получит за конкретный срок.</p>

          <div class="hero5-meta">
            <span class="hero5-meta-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
              с нуля за N месяцев
            </span>
            <span class="hero5-meta-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
              Доступ навсегда
            </span>
            <span class="hero5-meta-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg>
              Диплом гос. образца
            </span>
          </div>

          <div class="hero5-cta-row">
            <button class="btn btn--primary btn--lg">Записаться со скидкой
              <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>
            </button>
            <button class="btn btn--ghost btn--lg">Получить консультацию</button>
          </div>
        </div>
      </div>
    </div>

    <div class="hero5-badges">
      <div class="hero5-discount"><big>−60%</big><small>до конца недели</small></div>
      <div class="hero5-rating">
        <b>4.8</b>
        <div>
          <div class="stars">★★★★★</div>
          <span style="color: var(--color-text-muted)">N студентов</span>
        </div>
      </div>
    </div>
  </section>
  <script src="../js/components.js" defer></script>
</body>
</html>
